<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publisher App</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#121927; --panel-2:#0f1521; --border:#232f45;
    --text:#e7ecf5; --text-dim:#8a96ab; --accent:#3fa7ff;
    --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --mono:'Consolas','SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel-2);
  }
  header h1{font-size:16px; margin:0;}
  header h1 span{color:var(--accent);}
  .target{font-size:12px; color:var(--text-dim); font-family:var(--mono);}
  .status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim);}
  .dot.on{background:var(--ok); box-shadow:0 0 6px var(--ok);}
  .dot.off{background:var(--err); box-shadow:0 0 6px var(--err);}
  .dot.connected{background:var(--ok); box-shadow:0 0 5px var(--ok);}
  .dot.reconnecting{background:var(--warn); box-shadow:0 0 5px var(--warn);}

  main{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  label{font-size:11.5px; color:var(--text-dim); display:block; margin-bottom:4px;}
  input[type=text], textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 10px; font-size:13px; font-family:var(--mono);
  }
  .row{display:flex; gap:8px; margin-bottom:10px;}
  .row > *{flex:1;}
  button{
    background:var(--accent); color:#04121f; border:none; border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  button.danger{background:var(--panel-2); color:var(--err); border:1px solid var(--err);}
  button.ghost{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border);}
  button:disabled{opacity:.5; cursor:not-allowed;}

  .instance-id{font-size:11px; color:var(--text-dim); font-family:var(--mono); margin-bottom:14px;}
  .instance-id b{color:var(--text);}

  .pub-card{border:1px solid var(--border); border-radius:10px; background:var(--panel); overflow:hidden; margin-bottom:14px;}
  .pub-card-head{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border); font-size:12px;}
  .pub-card-head .topic{font-weight:700; font-family:var(--mono);}
  .pub-card-head .name{color:var(--text-dim); font-family:var(--mono); font-size:10.5px;}
  .pub-card-head .spacer{flex:1;}
  .pub-card-body{padding:10px 12px; display:flex; flex-direction:column; gap:8px;}
  .pub-card-body textarea{min-height:60px;}
  .pub-log{font-size:11px; color:var(--text-dim); font-family:var(--mono);}
  .pub-log.error{color:var(--err);}
  .empty{color:var(--text-dim); font-size:12.5px; text-align:center; padding:24px 8px;}
  .hint{font-size:11px; color:var(--text-dim); margin-top:8px;}
</style>
</head>
<body>

<header>
  <h1>Publisher <span>App</span></h1>
  <div class="target">Broker țintă: <span id="targetLabel">...</span></div>
  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Verific...</span>
  </div>
</header>

<main>
  <div class="instance-id">Instanța acestui proces: <b id="instanceIdLabel">...</b> · port <b id="instancePortLabel">...</b></div>

  <div id="connectForm">
    <div class="row">
      <div>
        <label for="pubTopic">Topic</label>
        <input type="text" id="pubTopic" placeholder="ex: sport" value="sport">
      </div>
      <div>
        <label for="pubName">Nume publisher (opțional)</label>
        <input type="text" id="pubName" placeholder="ex: P1">
      </div>
    </div>
    <button id="pubConnect">Conectează</button>
    <div class="hint">Pentru un al doilea Publisher, rulează din nou <code>app.py</code> într-un alt terminal — va porni automat pe alt port, cu alt ID.</div>
  </div>

  <div id="pubCardWrap" style="margin-top:16px;"></div>
</main>

<script>
function el(id){ return document.getElementById(id); }
let instanceTopic = null;
let since = 0;

async function loadConfig(){
  try{
    const res = await fetch("/api/config");
    const cfg = await res.json();
    el("targetLabel").textContent = `${cfg.brokerHost}:${cfg.brokerTcpPort}`;
    el("instanceIdLabel").textContent = cfg.instanceId;
    el("instancePortLabel").textContent = cfg.uiPort;
  } catch(e){
    el("targetLabel").textContent = "necunoscut";
  }
}

function setStatus(online){
  el("statusDot").className = "dot " + (online ? "on" : "off");
  el("statusText").textContent = online ? "Server activ" : "Server indisponibil";
}

function pubCardHtml(topic, name){
  return `
    <div class="pub-card">
      <div class="pub-card-head">
        <span class="dot" id="pubdot"></span>
        <span class="topic">${topic}</span>
        <span class="name">${name}</span>
        <span class="spacer"></span>
        <span id="pubsent" style="color:var(--text-dim); font-size:10.5px;">0 trimise</span>
        <button class="ghost" id="pubDisconnect" style="padding:2px 10px; font-size:11px;">Deconectează</button>
      </div>
      <div class="pub-card-body">
        <textarea id="pubpayload" placeholder='{"mesaj": "Scor final 2-1"}'></textarea>
        <div class="row" style="margin-bottom:0;">
          <button id="pubSend">Trimite</button>
          <button id="pubSendInvalid" class="danger">Trimite INVALID (test DLQ)</button>
        </div>
        <div class="pub-log" id="publog"></div>
      </div>
    </div>
  `;
}

async function connectPublisher(){
  const topic = el("pubTopic").value.trim();
  const name = el("pubName").value.trim();
  if(!topic) return;

  const res = await fetch("/api/connect", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ topic, name })
  });
  const data = await res.json();
  if(res.status >= 400){
    alert(data.reason || "Nu s-a putut conecta.");
    return;
  }

  instanceTopic = topic;
  el("connectForm").style.display = "none";
  el("pubCardWrap").innerHTML = pubCardHtml(topic, data.name);

  const dot = el("pubdot");
  if(dot) dot.className = "dot " + (data.status === "connected" ? "connected" : "reconnecting");

  el("pubDisconnect").addEventListener("click", disconnectPublisher);
  el("pubSend").addEventListener("click", sendMessage);
  el("pubSendInvalid").addEventListener("click", sendInvalid);
}

async function disconnectPublisher(){
  await fetch("/api/disconnect", { method: "POST" });
  instanceTopic = null;
  el("pubCardWrap").innerHTML = "";
  el("connectForm").style.display = "block";
}

function pubLogLine(text, isError){
  const log = el("publog");
  if(!log) return;
  log.className = "pub-log" + (isError ? " error" : "");
  log.textContent = text;
}

async function sendMessage(){
  const raw = el("pubpayload").value.trim();
  let payload = raw;
  if(raw){
    try{ payload = JSON.parse(raw); } catch(e){ payload = { text: raw }; }
  } else {
    payload = { text: "" };
  }

  try{
    const res = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ payload })
    });
    const ack = await res.json();
    if(ack.status === "ok"){
      const sentEl = el("pubsent");
      if(sentEl) sentEl.textContent = (parseInt(sentEl.textContent) || 0) + 1 + " trimise";
      pubLogLine("✓ ACK primit · " + new Date().toLocaleTimeString(), false);
      const dot = el("pubdot");
      if(dot) dot.className = "dot connected";
    } else {
      pubLogLine("✗ " + (ack.reason || "eroare"), true);
    }
  } catch(e){
    pubLogLine("✗ Nu s-a putut contacta serverul", true);
  }
}

async function sendInvalid(){
  if(!instanceTopic) return;
  try{
    const res = await fetch("/api/publish-invalid", { method: "POST" });
    const ack = await res.json();
    pubLogLine("☠ Mesaj corupt trimis → " + (ack.reason || ack.status), true);
  } catch(e){
    pubLogLine("✗ Nu s-a putut contacta serverul", true);
  }
}

async function pollStatus(){
  try{
    const res = await fetch("/api/instance");
    if(!res.ok) throw new Error();
    setStatus(true);
  } catch(e){ setStatus(false); }
}

el("pubConnect").addEventListener("click", connectPublisher);

loadConfig();
pollStatus();
setInterval(pollStatus, 2000);
</script>
</body>
</html>
