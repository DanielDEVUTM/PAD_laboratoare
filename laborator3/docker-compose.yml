# Lab 3 - Web proxy / Data Warehouse cluster
#
#   client (Postman / UI) --> gateway:8000 --+--> dw-1 \
#                               |  (Redis)   +--> dw-2  >--> MongoDB replica set (mongo1, mongo2, mongo3)
#                               |            +--> dw-3 /
#                               +-- service discovery + health check + round-robin + cache + priority + circuit breaker
#
# Only the gateway (8000) and the UI (3000) are published. The Data Warehouse nodes and the
# databases are reachable only inside the Docker network, exactly like real microservices.
name: pad-lab3

x-mongo: &mongo
  image: mongo:7
  command: ["--replSet", "rs0", "--bind_ip_all"]
  restart: unless-stopped

x-dw: &dw
  build: ./dw-node
  image: lab3-dw-node
  restart: unless-stopped
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    gateway:
      condition: service_started
  environment: &dw-env
    GATEWAY_URL: http://gateway:8000
    MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/warehouse?replicaSet=rs0&readPreference=secondaryPreferred&w=majority&serverSelectionTimeoutMS=5000&connectTimeoutMS=2000

services:
  # ---- databases: one replica set, 3 members. Replication = built-in synchronisation,
  #      if the primary dies the remaining members elect a new primary automatically.
  mongo1:
    <<: *mongo
    volumes: [mongo1-data:/data/db]
  mongo2:
    <<: *mongo
    volumes: [mongo2-data:/data/db]
  mongo3:
    <<: *mongo
    volumes: [mongo3-data:/data/db]

  # ---- one-shot job: rs.initiate + seed (same initial data for every start)
  mongo-init:
    image: mongo:7
    depends_on: [mongo1, mongo2, mongo3]
    volumes:
      - ./infra/mongo-init.sh:/init.sh:ro
      - ./infra/seed.js:/seed.js:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  # ---- cache (the small "memory" database connected to the gateway)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  gateway:
    build: ./gateway
    image: lab3-gateway
    ports: ["8000:8000"]
    environment:
      REDIS_HOST: redis
    depends_on: [redis]
    restart: unless-stopped

  # ---- the same API, three times (scalability). Add dw-4, dw-5 ... the same way:
  #      they register themselves in the gateway automatically.
  dw-1:
    <<: *dw
    environment: {<<: *dw-env, NODE_ID: dw-1}
  dw-2:
    <<: *dw
    environment: {<<: *dw-env, NODE_ID: dw-2}
  dw-3:
    <<: *dw
    environment: {<<: *dw-env, NODE_ID: dw-3}

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
