spring.application.name=gateway
server.port=${PORT:8000}

# thread-per-request
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=400
spring.task.scheduling.pool.size=4

spring.jackson.serialization.write-dates-as-timestamps=false

# --- health check ---
gateway.health.interval-ms=${HEALTH_INTERVAL_MS:1000}
gateway.health.timeout-ms=${HEALTH_TIMEOUT_MS:1000}
gateway.health.failures-to-down=${HEALTH_FAILURES_TO_DOWN:2}
gateway.registry.evict-after-ms=${EVICT_AFTER_MS:60000}

# --- proxy ---
gateway.proxy.request-timeout-ms=${REQUEST_TIMEOUT_MS:2000}
gateway.proxy.max-attempts=${MAX_ATTEMPTS:3}
gateway.proxy.workers=${PROXY_WORKERS:8}
gateway.proxy.breaker-cooldown-ms=${BREAKER_COOLDOWN_MS:10000}

# --- cache (Redis) ---
gateway.cache.redis-host=${REDIS_HOST:redis}
gateway.cache.redis-port=${REDIS_PORT:6379}
gateway.cache.ttl-seconds=${CACHE_TTL_SECONDS:30}
gateway.cache.write-guard-ms=${CACHE_WRITE_GUARD_MS:1500}
gateway.orchestrator-url=${ORCHESTRATOR_URL:http://orchestrator:8001}
gateway.sync-url=${SYNC_URL:http://sync:8002}
