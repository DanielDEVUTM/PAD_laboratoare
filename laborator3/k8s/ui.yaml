apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: pad-lab3
spec:
  replicas: 1
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      containers:
        - name: ui
          image: lab3-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: pad-lab3
spec:
  type: NodePort
  selector: { app: ui }
  ports:
    - port: 3000
      targetPort: 80
      nodePort: 30300
