# MongoDB replica set: 3 pods of a StatefulSet. Stable DNS names (mongo-0.mongo, ...) are required
# because the replica-set configuration stores the member host names.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: pad-lab3
spec:
  clusterIP: None            # headless: gives every pod its own DNS record
  selector: { app: mongo }
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: pad-lab3
spec:
  serviceName: mongo
  replicas: 3
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# One-shot job: rs.initiate + seed (scripts come from the ConfigMap generated by kustomize)
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: pad-lab3
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command: ["sh", "/scripts/mongo-init.sh"]
          env:
            - name: MONGO_HOSTS
              value: "mongo-0.mongo.pad-lab3.svc.cluster.local:27017 mongo-1.mongo.pad-lab3.svc.cluster.local:27017 mongo-2.mongo.pad-lab3.svc.cluster.local:27017"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: scripts
              mountPath: /seed.js
              subPath: seed.js
      volumes:
        - name: scripts
          configMap:
            name: mongo-init-scripts
