spring.application.name=orchestrator
server.port=${PORT:8001}

# image used for new API containers (built by docker compose as service "dw-image")
orchestrator.dw-image=${DW_IMAGE:lab3-dw-node}
orchestrator.mongo-image=${MONGO_IMAGE:mongo:7}
orchestrator.gateway-url=${GATEWAY_URL:http://gateway:8000}
# warehouses created at first start when none exist (0 = start empty and create them from the UI)
orchestrator.initial-warehouses=${INITIAL_WAREHOUSES:3}
