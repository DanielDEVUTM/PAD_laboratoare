spring.application.name=dw-node
server.port=${PORT:8080}

# thread-per-request: every HTTP request is served by its own Tomcat worker thread
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200

# MongoDB replica set (built-in replication = synchronisation between the DBs)
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongo1:27017,mongo2:27017,mongo3:27017/warehouse?replicaSet=rs0&readPreference=secondaryPreferred&w=majority&serverSelectionTimeoutMS=5000&connectTimeoutMS=2000}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Gateway registration (service discovery)
dw.gateway-url=${GATEWAY_URL:http://localhost:8000}
dw.node-id=${NODE_ID:${HOSTNAME:dw-local}}
dw.advertise-host=${ADVERTISE_HOST:}
dw.registration-interval-ms=${REGISTRATION_INTERVAL_MS:3000}
