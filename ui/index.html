<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pub/Sub Console</title>
<style>
  :root{
    --bg:#0b0f17;
    --panel:#121927;
    --panel-2:#0f1521;
    --border:#232f45;
    --text:#e7ecf5;
    --text-dim:#8a96ab;
    --accent:#4fd1c5;
    --accent-2:#8f7dfb;
    --ok:#4ade80;
    --err:#f87171;
    --warn:#fbbf24;
    --mono:'Consolas','SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel-2);
    flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:16px; margin:0; letter-spacing:.02em;}
  header h1 span{color:var(--accent);}
  .status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim); flex:0 0 auto;}
  .dot.on{background:var(--ok); box-shadow:0 0 6px var(--ok);}
  .dot.off{background:var(--err); box-shadow:0 0 6px var(--err);}

  main{
    flex:1; display:grid; gap:14px; padding:16px;
    grid-template-columns:340px 1fr 320px;
    min-height:0;
  }
  @media (max-width:980px){ main{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .panel h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);
    margin:0; padding:12px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel h2 .count{
    background:var(--panel-2); color:var(--text); font-size:11px; padding:2px 8px;
    border-radius:999px; border:1px solid var(--border); font-variant-numeric:tabular-nums;
  }
  .panel-body{padding:14px; display:flex; flex-direction:column; gap:10px; overflow:auto; flex:1; min-height:0;}

  label{font-size:11.5px; color:var(--text-dim); display:block; margin-bottom:4px;}
  input[type=text], textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 10px; font-size:13px; font-family:var(--mono);
  }
  textarea{resize:vertical; min-height:80px;}
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--accent);}

  .row{display:flex; gap:8px;}
  .row > *{flex:1;}

  button{
    background:var(--accent); color:#04231f; border:none; border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  button.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}
  button:disabled{opacity:.5; cursor:not-allowed;}

  .log{
    display:flex; flex-direction:column; gap:6px; font-size:12px; font-family:var(--mono);
  }
  .log-item{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--panel-2);
  }
  .log-item.ok{border-left:3px solid var(--ok);}
  .log-item.error{border-left:3px solid var(--err);}
  .log-item .meta{color:var(--text-dim); font-size:10.5px; margin-top:3px;}

  .feed{display:flex; flex-direction:column; gap:8px; flex:1; overflow:auto;}
  .msg{
    border:1px solid var(--border); border-radius:8px; padding:9px 11px; background:var(--panel-2);
    font-size:12.5px;
  }
  .msg .top{display:flex; justify-content:space-between; gap:8px; color:var(--text-dim); font-size:10.5px; margin-bottom:4px; font-family:var(--mono);}
  .msg pre{margin:0; white-space:pre-wrap; word-break:break-word; font-family:var(--mono); font-size:12px;}
  .empty{color:var(--text-dim); font-size:12.5px; text-align:center; padding:24px 8px;}

  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border);}
  th{color:var(--text-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;}
  td.num{font-variant-numeric:tabular-nums; text-align:right;}
  .pill{font-size:10.5px; padding:1px 7px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border);}
  .pill.warn{color:var(--warn); border-color:var(--warn);}

  .dlq-item{border:1px solid var(--border); border-left:3px solid var(--err); border-radius:8px; padding:8px 10px; background:var(--panel-2); margin-bottom:8px; font-size:11.5px;}
  .dlq-item .meta{color:var(--text-dim); font-family:var(--mono); font-size:10.5px; margin-bottom:4px;}
  .dlq-item .reason{color:var(--err);}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
</style>
</head>
<body>

<header>
  <h1>Pub<span>/</span>Sub <span>Console</span></h1>
  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Verific conexiunea cu Broker-ul...</span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Publisher <span class="count" id="publishCount">0</span></h2>
    <div class="panel-body">
      <div>
        <label for="pubTopic">Topic</label>
        <input type="text" id="pubTopic" placeholder="ex: sport" value="sport">
      </div>
      <div>
        <label for="pubPayload">Payload (text sau JSON)</label>
        <textarea id="pubPayload" placeholder='{"mesaj": "Scor final 2-1"}'></textarea>
      </div>
      <button id="pubSend">Trimite mesaj</button>
      <div class="log" id="pubLog"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Live feed <span class="count" id="feedCount">0</span></h2>
    <div class="panel-body">
      <div class="row">
        <div>
          <label for="subTopic">Topic urmărit</label>
          <input type="text" id="subTopic" placeholder="ex: sport" value="sport">
        </div>
      </div>
      <div class="row">
        <button id="subListen">Ascultă topicul</button>
        <button id="subClear" class="secondary">Golește</button>
      </div>
      <div class="feed" id="feed">
        <div class="empty">Alege un topic și apasă „Ascultă topicul” ca să vezi mesajele publicate live.</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Broker <span class="count" id="brokerBadge">—</span></h2>
    <div class="panel-body">
      <div>
        <label>Topicuri active</label>
        <table id="topicsTable">
          <thead><tr><th>Topic</th><th class="num">Subs</th><th class="num">Backlog</th></tr></thead>
          <tbody><tr><td colspan="3" class="empty">Niciun topic încă</td></tr></tbody>
        </table>
      </div>
      <div>
        <label style="margin-top:6px;">Dead Letter Queue <span class="pill warn" id="dlqCount">0</span></label>
        <div id="dlqList"><div class="empty">Gol — nimic nu a eșuat definitiv.</div></div>
      </div>
    </div>
  </section>
</main>

<script>
const API = "";
let feedSince = 0;
let currentTopic = null;
let publishCount = 0;

function el(id){ return document.getElementById(id); }

function setStatus(online){
  el("statusDot").className = "dot " + (online ? "on" : "off");
  el("statusText").textContent = online
    ? "Broker conectat (TCP 5050 / Admin 5052)"
    : "Broker indisponibil — pornește BrokerServer";
}

function fmtTime(iso){
  if(!iso) return "";
  try{ return new Date(iso).toLocaleTimeString(); } catch(e){ return iso; }
}

async function publish(){
  const topic = el("pubTopic").value.trim();
  const raw = el("pubPayload").value.trim();
  if(!topic){ return; }

  let payload = raw;
  if(raw){
    try{ payload = JSON.parse(raw); } catch(e){ payload = { text: raw }; }
  } else {
    payload = { text: "" };
  }

  el("pubSend").disabled = true;
  try{
    const res = await fetch(API + "/api/publish", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ topic, payload })
    });
    const ack = await res.json();
    publishCount++;
    el("publishCount").textContent = publishCount;

    const item = document.createElement("div");
    item.className = "log-item " + (ack.status === "ok" ? "ok" : "error");
    item.innerHTML = `<div>${ack.status === "ok" ? "✓ ACK primit" : "✗ " + (ack.reason || "eroare")}</div>` +
      `<div class="meta">topic: ${topic} · ${new Date().toLocaleTimeString()}</div>`;
    el("pubLog").prepend(item);
  } catch(e){
    const item = document.createElement("div");
    item.className = "log-item error";
    item.textContent = "✗ Nu s-a putut contacta serverul UI: " + e;
    el("pubLog").prepend(item);
  } finally {
    el("pubSend").disabled = false;
  }
}

async function startListening(){
  const topic = el("subTopic").value.trim();
  if(!topic) return;
  currentTopic = topic;
  feedSince = 0;
  el("feed").innerHTML = "";
  el("feedCount").textContent = "0";

  await fetch(API + "/api/subscribe", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ topic })
  });
}

async function pollMessages(){
  if(!currentTopic) return;
  try{
    const res = await fetch(`${API}/api/messages/${encodeURIComponent(currentTopic)}?since=${feedSince}`);
    const data = await res.json();
    if(data.messages && data.messages.length){
      const feed = el("feed");
      for(const m of data.messages){
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<div class="top"><span>#${m.index} · id ${m.id ? m.id.slice(0,8) : "?"}</span><span>${fmtTime(m.timestamp)}</span></div>` +
          `<pre>${typeof m.payload === "object" ? JSON.stringify(m.payload, null, 2) : m.payload}</pre>`;
        feed.appendChild(div);
      }
      feed.scrollTop = feed.scrollHeight;
      feedSince = data.latest;
      el("feedCount").textContent = feedSince;
    }
  } catch(e){ /* silent, retried next tick */ }
}

async function pollTopics(){
  try{
    const res = await fetch(API + "/api/topics");
    const data = await res.json();
    setStatus(data.brokerOnline);
    el("brokerBadge").textContent = data.brokerOnline ? "online" : "offline";

    const tbody = document.querySelector("#topicsTable tbody");
    if(!data.topics || !data.topics.length){
      tbody.innerHTML = `<tr><td colspan="3" class="empty">Niciun topic încă</td></tr>`;
    } else {
      tbody.innerHTML = data.topics.map(t =>
        `<tr><td>${t.name}</td><td class="num">${t.subscriberCount}</td><td class="num">${t.backlogSize}</td></tr>`
      ).join("");
    }
  } catch(e){
    setStatus(false);
  }
}

async function pollDlq(){
  try{
    const res = await fetch(API + "/api/dlq");
    const data = await res.json();
    el("dlqCount").textContent = data.entries ? data.entries.length : 0;

    const list = el("dlqList");
    if(!data.entries || !data.entries.length){
      list.innerHTML = `<div class="empty">Gol — nimic nu a eșuat definitiv.</div>`;
      return;
    }
    list.innerHTML = data.entries.slice().reverse().map(e => `
      <div class="dlq-item">
        <div class="meta">${e.timestamp} · topic: ${e.topic}</div>
        <div class="reason">${e.reason}</div>
      </div>
    `).join("");
  } catch(e){ /* silent */ }
}

el("pubSend").addEventListener("click", publish);
el("subListen").addEventListener("click", startListening);
el("subClear").addEventListener("click", () => {
  el("feed").innerHTML = `<div class="empty">Golit. Apasă „Ascultă topicul” pentru a continua.</div>`;
});

pollTopics();
pollDlq();
setInterval(pollMessages, 1000);
setInterval(pollTopics, 2000);
setInterval(pollDlq, 2500);
</script>
</body>
</html>
