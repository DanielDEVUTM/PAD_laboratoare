# Deploys images that are ALREADY published (nothing is built here).
#   - manually: Actions -> "lab4 deploy only" -> Run workflow -> choose the tag
#   - from "lab4 CI/CD" on main
# Both go through the "production" environment, so the approval applies.
name: lab4 deploy only

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag: tree hash (git rev-parse 'HEAD^{tree}') or an older commit tag"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # checked before anybody is asked to approve
  images:
    name: images exist
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: All five images are published with this tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid tag"; exit 1; }
          ./laborator4/deploy/images-exist.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pad-lab4" "$TAG"

  deploy:
    name: deploy to AWS
    needs: images
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    # Continuous Delivery: "required reviewers" on this environment approve every deployment
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: lab4-deploy
    defaults:
      run:
        working-directory: laborator4
    env:
      ADMIN_USER: ${{ vars.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Deploy
        env:
          EDGE_HOST: ${{ vars.EDGE_HOST }}
          SSH_KEY: ${{ runner.temp }}/key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pad-lab4"
          ./deploy/deploy.sh

      - name: Check the deployed system
        env:
          BASE_URL: ${{ vars.SITE_URL }}
        run: ./deploy/verify.sh
