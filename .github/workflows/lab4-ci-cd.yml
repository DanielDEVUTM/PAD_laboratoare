# Lab 4 - CI/CD
#   every push   : unit tests, Terraform checks, linux/amd64 build, integration tests, publish to GHCR
#                  (the images are tagged with the tree hash of the commit: build once, deploy many)
#   push to main : if the images of this tree are already published, no build and no integration tests;
#                  then deploy (after manual approval), unless only .github/ or README files changed
name: lab4 CI/CD

# Every change starts the pipeline, on any branch that contains this file (no path filter).
# There is no pull_request trigger: a pull request shows the checks of the push run of the same commit,
# so the same code is not tested twice. (Pull requests from forks are therefore not tested.)
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab4-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      skip_build: ${{ steps.plan.outputs.skip_build }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous head is needed to see what the push changed
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        shell: bash # with pipefail: a failing plan.sh fails the step
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pad-lab4"
          ./laborator4/deploy/plan.sh | tee -a "$GITHUB_OUTPUT"

  test-java:
    name: unit tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, dw-node, orchestrator, sync]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: laborator4/${{ matrix.service }}/pom.xml
      - run: mvn -B -ntp verify
        working-directory: laborator4/${{ matrix.service }}

  test-ui:
    name: unit tests (ui)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: laborator4/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: laborator4/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  infrastructure:
    name: terraform and scripts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: laborator4
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: shellcheck --severity=warning deploy/*.sh terraform/nat.sh

  build:
    name: build linux/amd64, integration tests
    # after ALL tests: an image published in GHCR always comes from a content that passed them
    needs: [plan, test-java, test-ui, infrastructure]
    if: needs.plan.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: laborator4
    steps:
      - uses: actions/checkout@v7

      # separate builder only for the cached builds; plain `docker build` (used by the tests) keeps the default one
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false

      # layers are kept between runs (GitHub Actions cache): dependencies are not downloaded every time
      - name: Build dw-node
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/dw-node
          platforms: linux/amd64
          tags: lab4-dw-node:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-dw-node
          cache-to: type=gha,scope=lab4-dw-node,mode=max

      - name: Build gateway
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/gateway
          platforms: linux/amd64
          tags: lab4-gateway:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-gateway
          cache-to: type=gha,scope=lab4-gateway,mode=max

      - name: Build sync
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/sync
          platforms: linux/amd64
          tags: lab4-sync:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-sync
          cache-to: type=gha,scope=lab4-sync,mode=max

      - name: Build orchestrator
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4
          file: laborator4/orchestrator/Dockerfile
          platforms: linux/amd64
          tags: lab4-orchestrator:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-orchestrator
          cache-to: type=gha,scope=lab4-orchestrator,mode=max

      - name: Build ui
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/ui
          build-args: VITE_GATEWAY_URL=/api   # the UI calls the gateway on its own origin
          platforms: linux/amd64
          tags: lab4-ui:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-ui
          cache-to: type=gha,scope=lab4-ui,mode=max

      # failure injection (frozen / stopped nodes, primary election) is slow: only on manual runs (Run workflow)
      - name: Integration tests (single host)
        run: |
          INITIAL_WAREHOUSES=2 docker compose up -d --no-build
          for _ in $(seq 1 100); do
            up=$(curl -s localhost:8000/registry/instances | grep -o '"status":"UP"' | wc -l)
            [ "$up" -ge 2 ] && break
            sleep 3
          done
          ./scripts/smoke-test.sh ${{ github.event_name == 'workflow_dispatch' && '--chaos' || '' }}

      - name: Logs of the failed cluster
        if: failure()
        run: docker ps -a && docker compose logs --tail 80

      - name: Stop the single-host cluster
        if: always()
        run: ./scripts/down.sh

      - name: Integration tests (cloud topology, proxy with password, rolling update)
        run: HOST_IP=$(hostname -I | awk '{print $1}') ./deploy/test-topology.sh

      # the images that were just tested are the ones published; a published tag is never overwritten
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pad-lab4"
          for service in dw-node gateway sync orchestrator ui; do
            image="$prefix-$service:$TAG"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "already published: $image"
            else
              docker tag "lab4-$service" "$image"
              docker push "$image"
            fi
          done

  deploy:
    name: deploy to AWS
    needs: [plan, test-java, test-ui, infrastructure, build]
    # main only; the build job may be skipped only because the images already exist.
    # Enabled by the repository variable DEPLOY_ENABLED=true, once the infrastructure exists.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
      && needs.plan.outputs.deploy == 'true'
      && needs.test-java.result == 'success' && needs.test-ui.result == 'success'
      && needs.infrastructure.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.plan.outputs.skip_build == 'true'))
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/lab4-deploy.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
