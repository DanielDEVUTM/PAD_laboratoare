# Lab 4 - CI/CD
#   every push   : unit tests, Terraform checks, linux/amd64 build, integration tests
#   push to main : publish the images to GHCR and deploy them to AWS (after manual approval)
name: lab4 CI/CD

# Every change starts the pipeline, on any branch that contains this file (no path filter).
# There is no pull_request trigger: a pull request shows the checks of the push run of the same commit,
# so the same code is not tested twice. (Pull requests from forks are therefore not tested.)
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab4-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-java:
    name: unit tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, dw-node, orchestrator, sync]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: laborator4/${{ matrix.service }}/pom.xml
      - run: mvn -B -ntp verify
        working-directory: laborator4/${{ matrix.service }}

  test-ui:
    name: unit tests (ui)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: laborator4/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: laborator4/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  infrastructure:
    name: terraform and scripts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: laborator4
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: shellcheck --severity=warning deploy/*.sh terraform/nat.sh

  build:
    name: build linux/amd64, integration tests
    # runs in parallel with the unit tests (faster); the deploy job waits for all of them
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: laborator4
    steps:
      - uses: actions/checkout@v7

      # separate builder only for the cached builds; plain `docker build` (used by the tests) keeps the default one
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false

      # layers are kept between runs (GitHub Actions cache): dependencies are not downloaded every time
      - name: Build dw-node
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/dw-node
          platforms: linux/amd64
          tags: lab4-dw-node:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-dw-node
          cache-to: type=gha,scope=lab4-dw-node,mode=max

      - name: Build gateway
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/gateway
          platforms: linux/amd64
          tags: lab4-gateway:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-gateway
          cache-to: type=gha,scope=lab4-gateway,mode=max

      - name: Build sync
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/sync
          platforms: linux/amd64
          tags: lab4-sync:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-sync
          cache-to: type=gha,scope=lab4-sync,mode=max

      - name: Build orchestrator
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4
          file: laborator4/orchestrator/Dockerfile
          platforms: linux/amd64
          tags: lab4-orchestrator:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-orchestrator
          cache-to: type=gha,scope=lab4-orchestrator,mode=max

      - name: Build ui
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: laborator4/ui
          build-args: VITE_GATEWAY_URL=/api   # the UI calls the gateway on its own origin
          platforms: linux/amd64
          tags: lab4-ui:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=lab4-ui
          cache-to: type=gha,scope=lab4-ui,mode=max

      # failure injection (frozen / stopped nodes, primary election) is slow: only on manual runs (Run workflow)
      - name: Integration tests (single host)
        run: |
          INITIAL_WAREHOUSES=2 docker compose up -d --no-build
          for _ in $(seq 1 100); do
            up=$(curl -s localhost:8000/registry/instances | grep -o '"status":"UP"' | wc -l)
            [ "$up" -ge 2 ] && break
            sleep 3
          done
          ./scripts/smoke-test.sh ${{ github.event_name == 'workflow_dispatch' && '--chaos' || '' }}

      - name: Logs of the failed cluster
        if: failure()
        run: docker ps -a && docker compose logs --tail 80

      - name: Stop the single-host cluster
        if: always()
        run: ./scripts/down.sh

      - name: Integration tests (cloud topology, proxy with password, rolling update)
        run: HOST_IP=$(hostname -I | awk '{print $1}') ./deploy/test-topology.sh

      # the images that were just tested are the ones published
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images
        if: github.ref == 'refs/heads/main'
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pad-lab4"
          for service in dw-node gateway sync orchestrator ui; do
            docker tag "lab4-$service" "$prefix-$service:$GITHUB_SHA"
            docker push "$prefix-$service:$GITHUB_SHA"
          done

  deploy:
    name: deploy to AWS
    needs: [test-java, test-ui, infrastructure, build]
    # enabled by the repository variable DEPLOY_ENABLED=true, once the infrastructure exists
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # Continuous Delivery: add "required reviewers" to this environment to approve every deployment
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: lab4-deploy
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: laborator4
    env:
      ADMIN_USER: ${{ vars.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Deploy
        env:
          EDGE_HOST: ${{ vars.EDGE_HOST }}
          SSH_KEY: ${{ runner.temp }}/key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pad-lab4" TAG="$GITHUB_SHA"
          ./deploy/deploy.sh

      - name: Check the deployed system
        env:
          BASE_URL: ${{ vars.SITE_URL }}
        run: ./deploy/verify.sh
