spring.application.name=orchestrator
server.port=${PORT:8001}

# image used for new API containers (built by docker compose as service "dw-image")
orchestrator.dw-image=${DW_IMAGE:lab4-dw-node}
orchestrator.mongo-image=${MONGO_IMAGE:mongo:7}
orchestrator.gateway-url=${GATEWAY_URL:http://gateway:8000}
# warehouses created at first start when none exist (0 = start empty and create them from the UI)
orchestrator.initial-warehouses=${INITIAL_WAREHOUSES:3}
orchestrator.sync-url=${SYNC_URL:http://sync:8002}
# publish the API of every warehouse on its own host port (wh-1 -> 8101 ...) so it can be tested directly
orchestrator.publish-api-ports=${PUBLISH_API_PORTS:true}
orchestrator.api-port-base=${API_PORT_BASE:8101}
orchestrator.db-port-base=${DB_PORT_BASE:27101}
# databases are published only for local inspection; keep false in the cloud (MongoDB has no password here)
orchestrator.publish-db-ports=${PUBLISH_DB_PORTS:${PUBLISH_API_PORTS:true}}
# two-machine setup: private IP of THIS machine, announced to the gateway (empty = everything on one host)
orchestrator.advertise-host=${ADVERTISE_HOST:}
# host IP on which the ports are published (empty = all interfaces)
orchestrator.publish-bind-ip=${PUBLISH_BIND_IP:}
# memory limit of every API container in MB (0 = no limit)
orchestrator.api-memory-mb=${API_MEMORY_MB:0}
