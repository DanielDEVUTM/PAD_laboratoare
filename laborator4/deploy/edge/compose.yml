# VM "edge" (public): reverse proxy with password -> UI + gateway; Redis cache.
# Variables: /etc/pad/infra.env (written by cloud-init) + release.env (written by deploy.sh).
name: pad-lab4-edge

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      ADMIN_USER: ${ADMIN_USER:?}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # TLS certificates: must survive restarts
      - caddy-config:/config
    depends_on: [ui, gateway]
    mem_limit: 128m
    restart: unless-stopped

  ui:
    image: ${IMAGE_PREFIX:?}-ui:${TAG:?}
    mem_limit: 64m
    restart: unless-stopped

  gateway:
    image: ${IMAGE_PREFIX:?}-gateway:${TAG:?}
    # private network only: the API nodes on the "data" VM register here
    ports: ["${BIND_IP:-${EDGE_PRIVATE_IP:?}}:8000:8000"]
    environment:
      REDIS_HOST: redis
      ORCHESTRATOR_URL: http://${DATA_PRIVATE_IP:?}:8001
      SYNC_URL: http://${DATA_PRIVATE_IP:?}:8002
    depends_on: [redis]
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
